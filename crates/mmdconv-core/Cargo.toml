[package]
name = "mmdconv-core"
description = "Rigged-model to MikuMikuDance PMX conversion pipeline: IR, importers, skeleton mapping, PMX reader/writer/validator."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
glam = { version = "0.29", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga", "bmp", "webp", "tiff"] }
indexmap = "2"
thiserror = "2"
toml_edit = { version = "0.22", features = ["serde"] }
unicode-normalization = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
